name: audiobook-generator
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
    # LangChain and LangGraph for workflow orchestration
    - langchain>=0.3.0
    - langgraph>=0.2.0
    - langchain-ollama>=0.2.0
    # Document processing
    - striprtf>=0.0.26
    - markdownify>=0.14.1
    - python-docx>=1.1.2
    - beautifulsoup4>=4.12.0
    - lxml>=5.0.0
    # Text processing
    - nltk>=3.9.0
    - regex>=2024.0.0
    - ftfy>=6.3.0
    - unidecode>=1.3.0
    # Audio processing
    - soundfile>=0.12.0
    - librosa>=0.10.0
    - numpy>=1.26.0
    - scipy>=1.14.0
    # Speech-to-text verification
    - faster-whisper>=1.0.0
    # Progress and CLI
    - typer>=0.12.0
    - rich>=13.9.0
    - tqdm>=4.66.0
    # State persistence
    - pydantic>=2.9.0
    # Qwen TTS (from parent project)
    - qwen-tts
    # Utilities
    - python-dotenv>=1.0.0
